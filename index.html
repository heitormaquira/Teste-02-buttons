<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas Maquira</title>
    <link href="./css/style.css" rel="stylesheet">
    <style>
        :root {
            --tam: 76px;          /* tamanho do cubo */
            --raio: 14px;         /* canto arredondado das faces */
            --duracao: 16s;       /* tempo de uma volta completa (4 faces) */
        }

        .cubos {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 22px;
            padding: 48px 16px;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Cada link é a "cena" 3D */
        .cubo {
            width: var(--tam);
            height: var(--tam);
            perspective: 600px;
            display: block;
            outline: none;
        }

        .cubo-giro {
            display: block;
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            animation: girar var(--duracao) cubic-bezier(.65, 0, .35, 1) infinite;
            /* cada cubo começa num momento diferente → efeito "onda" */
            animation-delay: calc(var(--i) * -0.7s);
            transition: transform .3s;
        }

        .face {
            position: absolute;
            inset: 0;
            background: #fff var(--logo) center / contain no-repeat;
            background-origin: content-box;
            padding: 3px;   /* espaço entre o logo e a borda: menor = logo maior */
            border: 1px solid #e3e3e3;
            border-radius: var(--raio);
            box-shadow: 0 4px 10px rgba(0, 0, 0, .06);
            backface-visibility: hidden;
        }

        /* 4 faces laterais, todas com o mesmo logo */
        .face:nth-child(1) { transform: rotateY(0deg)   translateZ(calc(var(--tam) / 2)); }
        .face:nth-child(2) { transform: rotateY(90deg)  translateZ(calc(var(--tam) / 2)); }
        .face:nth-child(3) { transform: rotateY(180deg) translateZ(calc(var(--tam) / 2)); }
        .face:nth-child(4) { transform: rotateY(270deg) translateZ(calc(var(--tam) / 2)); }

        /* Gira 90°, para um pouco, gira de novo — parece um cubo "virando" */
        @keyframes girar {
            0%, 18%   { transform: translateZ(calc(var(--tam) / -2)) rotateY(0deg); }
            25%, 43%  { transform: translateZ(calc(var(--tam) / -2)) rotateY(-90deg); }
            50%, 68%  { transform: translateZ(calc(var(--tam) / -2)) rotateY(-180deg); }
            75%, 93%  { transform: translateZ(calc(var(--tam) / -2)) rotateY(-270deg); }
            100%      { transform: translateZ(calc(var(--tam) / -2)) rotateY(-360deg); }
        }

        /* Passou o mouse (ou focou com Tab): para de girar e destaca */
        .cubo:hover .cubo-giro,
        .cubo:focus-visible .cubo-giro {
            animation-play-state: paused;
        }
        .cubo:hover .face,
        .cubo:focus-visible .face {
            border-color: #0d6efd;
            box-shadow: 0 8px 18px rgba(13, 110, 253, .25);
        }

        /* Quem pediu menos movimento no sistema operacional não vê a animação */
        @media (prefers-reduced-motion: reduce) {
            .cubo-giro { animation: none; transform: none; }
        }
    </style>
</head>
