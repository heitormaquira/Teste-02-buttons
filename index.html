<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas Maquira</title>
    <style>
        :root {
            --tam: 68px;          /* tamanho do cubo (a caixa do Google Sites tem ~88px de altura) */
            --raio: 14px;         /* canto arredondado das faces */
            --duracao: 2.5s;      /* tempo da volta ao passar o mouse */
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: #fff;
            overflow: hidden;     /* sem barra de rolagem dentro do Google Sites */
        }

        .cubos {
            display: flex;
            flex-wrap: nowrap;
            justify-content: center;
            align-items: center;  /* centraliza na altura da caixa */
            gap: 20px;
            height: 100%;
            padding: 0 16px;
        }

        /* Cada link é a "cena" 3D */
        .cubo {
            flex: 0 0 var(--tam);
            width: var(--tam);
            height: var(--tam);
            perspective: 600px;
            display: block;
            outline: none;
        }

        .cubo-giro {
            display: block;
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transform: translateZ(calc(var(--tam) / -2));   /* parado, mostrando a frente */
        }

        .face {
            position: absolute;
            inset: 0;
            background: #fff var(--logo) center / contain no-repeat;
            background-origin: content-box;
            padding: 3px;         /* espaço entre o logo e a borda: menor = logo maior */
            border: 1px solid #e3e3e3;
            border-radius: var(--raio);
            box-shadow: 0 2px 6px rgba(0, 0, 0, .06);
            backface-visibility: hidden;
        }

        /* 4 faces laterais, todas com o mesmo logo */
        .face:nth-child(1) { transform: rotateY(0deg)   translateZ(calc(var(--tam) / 2)); }
        .face:nth-child(2) { transform: rotateY(90deg)  translateZ(calc(var(--tam) / 2)); }
        .face:nth-child(3) { transform: rotateY(180deg) translateZ(calc(var(--tam) / 2)); }
        .face:nth-child(4) { transform: rotateY(270deg) translateZ(calc(var(--tam) / 2)); }

        /* Ao passar o mouse (ou focar com Tab): dá uma volta completa e destaca */
        @keyframes girar {
            from { transform: translateZ(calc(var(--tam) / -2)) rotateY(0deg); }
            to   { transform: translateZ(calc(var(--tam) / -2)) rotateY(-360deg); }
        }
        /* a classe "gira" é colocada pelo script lá embaixo quando o mouse encosta,
           e só sai quando a volta termina — assim o giro sempre completa */
        .cubo.gira .cubo-giro {
            animation: girar var(--duracao) cubic-bezier(.65, 0, .35, 1);
        }
        .cubo:hover .face,
        .cubo:focus-visible .face {
            border-color: #0d6efd;
            box-shadow: 0 3px 8px rgba(13, 110, 253, .3);
        }

        /* Quem pediu menos movimento no sistema operacional não vê a animação */
        @media (prefers-reduced-motion: reduce) {
            .cubo.gira .cubo-giro { animation: none; }
        }
    </style>
</head>

<body>

        <a class="cubo" style="--i:12; --logo:url('https://maquira.com.br/wp-content/uploads/2026/01/Totvs-Chile.png')" href="http://maq-srv-erp-01:4321/?StartProg=SIGAMDI&Comm=TCP&Env=Envmaqch" target="_blank" rel="noopener" title="TOTVS Chile" aria-label="TOTVS Chile"><span class="cubo-giro"><span class="face"></span><span class="face"></span><span class="face"></span><span class="face"></span></span></a>
    </nav>

    <script>
        // Mouse encostou (ou focou com Tab) → começa a girar; a volta termina sozinha
        document.querySelectorAll('.cubo').forEach(function (cubo) {
            function girar() { cubo.classList.add('gira'); }
            cubo.addEventListener('mouseenter', girar);
            cubo.addEventListener('focus', girar);
            cubo.addEventListener('animationend', function () { cubo.classList.remove('gira'); });
        });
    </script>
</body>
</html>
